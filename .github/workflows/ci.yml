name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore ChatGPT.csproj
        dotnet restore Tests/ChatGPT.Tests/ChatGPT.Tests.csproj

    - name: Build Release
      run: dotnet build ChatGPT.csproj --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test Tests/ChatGPT.Tests/ChatGPT.Tests.csproj --no-restore
